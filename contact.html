  <section class="main-content">
    <h1>Get in Touch</h1>
    <p>We love hearing from tech enthusiasts, partners, and innovators.</p>
    <img class="fade-in" src="https://source.unsplash.com/featured/800x400?communication,technology" alt="Tech Communication" />
    <form class="validate" action="#" method="POST" style="margin-top:1.5rem;display:flex;flex-direction:column;gap:0.75rem;max-width:400px;">
      <input type="text" name="name" placeholder="Your Name" required style="padding:0.5rem;" />
      <input type="email" name="email" placeholder="Your Email" required style="padding:0.5rem;" />
      <textarea name="message" placeholder="Your Message" rows="4" required style="padding:0.5rem;"></textarea>
      <button type="submit" style="padding:0.5rem;background:#0066cc;color:#fff;border:none;cursor:pointer;">Send</button>
    </form>
    <p style="margin-top:1rem;">Our team monitors the latest trends in AI, cloud, robotics, and more, and will get back to you promptly.</p>
  </section>
  
<script src="assets/js/script.js"></script>
